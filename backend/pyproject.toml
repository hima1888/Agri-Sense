[project]
name = "agri-sense-api"
version = "1.0.0"
description = "AGRI-SENSE backend API (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # autogenerated DDL
"migrations/env.py" = ["E402"]
"tests/**" = ["S105", "S106", "S311"]
"app/simulator/**" = ["S311"]  # seeded PRNGs for reproducible simulation, not crypto  # fake secrets/tokens are test fixtures

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = [".venv", "migrations/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Floor for `pytest --cov` locally and in CI; measured 94 % (93 % in CI, where disease-model tests skip).
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
