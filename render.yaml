# Phase 20: Render Blueprint (New + > Blueprint, pick this repo). Values marked sync:false are asked for once.
# Auth uses a hosted Supabase project (Auth only); the app's data lives in the Render Postgres below.
databases:
  - name: agri-sense-db
    plan: free
    databaseName: agrisense
    user: agrisense
    postgresMajorVersion: "17"

services:
  - type: web
    name: agri-sense-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: agri-sense-db, property: connectionString }
      - key: SUPABASE_URL
        sync: false          # https://<project-ref>.supabase.co
      - key: CORS_ORIGINS
        sync: false          # the web app's URL, e.g. https://agri-sense-web.onrender.com
      - key: SIMULATOR_ENABLED
        value: "true"

  - type: web
    name: agri-sense-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # the API's URL, e.g. https://agri-sense-api.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: X-Frame-Options, value: DENY }
      - { path: /*, name: Referrer-Policy, value: no-referrer }
      - { path: /*, name: Permissions-Policy, value: "camera=(self), microphone=(), geolocation=()" }
      - { path: /*, name: Cross-Origin-Opener-Policy, value: same-origin }
      - { path: /assets/*, name: Cache-Control, value: "public, max-age=31536000, immutable" }
