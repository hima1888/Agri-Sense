# Phase 20: the whole app as production containers (database + API + web).
#   cp .env.production.example .env.production   # fill in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Open http://localhost:8080. Auth stays with Supabase (hosted, or the local stack for a dry run).
name: agri-sense-prod
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agrisense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: agrisense
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrisense -d agrisense"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://agrisense:${POSTGRES_PASSWORD}@db:5432/agrisense
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      CORS_ORIGINS: ${PUBLIC_WEB_ORIGIN:-http://localhost:8080}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      ALERTS_ENABLED: "true"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""   # same origin: nginx proxies /api to the api service
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?set SUPABASE_PUBLISHABLE_KEY}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
